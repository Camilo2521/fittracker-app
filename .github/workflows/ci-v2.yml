name: CI v2 — Tests + APK Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── BACKEND NODE ──────────────────────────────────────────────
  test-node:
    name: Node.js Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar sintaxis rutas v1
        run: node -e "require('./src/routes/v1')" && echo "✅ Rutas v1 OK"

      - name: Verificar feature flags
        run: |
          node -e "
            const flags = require('./src/middleware/featureFlags');
            console.log('Flags:', flags.FLAGS);
            console.assert(flags.FLAGS.vision_v2  === false, 'vision_v2 debe ser false por defecto');
            console.assert(flags.FLAGS.rag_enabled === false, 'rag_enabled debe ser false por defecto');
            console.log('✅ Feature flags OK');
          "

      - name: Verificar token interno
        run: |
          node -e "
            process.env.INTERNAL_API_SECRET = 'test_secret_12345678901234567890123456789012345678';
            const { generateInternalToken } = require('./src/utils/internalToken');
            const token = generateInternalToken();
            const parts = token.split('.');
            console.assert(parts.length === 2, 'Token debe tener formato ts.sig');
            console.assert(parseInt(parts[0]) > 0, 'Timestamp debe ser positivo');
            console.log('✅ Token interno OK:', token.slice(0,20) + '...');
          "

      - name: Verificar migración SQLite idempotente
        run: |
          node -e "
            const Database = require('better-sqlite3');
            const db = new Database(':memory:');
            db.exec(\`
              CREATE TABLE users (
                id INTEGER PRIMARY KEY AUTOINCREMENT,
                external_id TEXT,
                name TEXT
              )
            \`);
            // Simular migración
            const cols = [
              ['height_cm',      'REAL DEFAULT NULL'],
              ['age',            'INTEGER DEFAULT NULL'],
              ['gender',         'TEXT DEFAULT NULL'],
              ['activity_level', \"TEXT DEFAULT 'moderate'\"],
              ['restrictions',   'TEXT DEFAULT NULL'],
            ];
            for (const [col, def] of cols) {
              db.prepare(\`ALTER TABLE users ADD COLUMN \${col} \${def}\`).run();
            }
            const info = db.prepare('PRAGMA table_info(users)').all();
            const names = info.map(c => c.name);
            console.assert(names.includes('height_cm'), 'height_cm debe existir');
            console.assert(names.includes('activity_level'), 'activity_level debe existir');
            console.log('✅ Migración SQLite OK. Columnas:', names.join(', '));
          "

  # ── PYTHON SERVICE ────────────────────────────────────────────
  test-python:
    name: Python Service Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python_service

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: python_service/requirements.txt

      - name: Instalar dependencias (sin ML pesado)
        run: |
          pip install --no-cache-dir \
            fastapi uvicorn pydantic pydantic-settings \
            sqlalchemy asyncpg psycopg2-binary alembic pgvector

      - name: Verificar imports principales
        run: |
          python -c "
          from app.config import get_settings
          from app.auth import verify_internal_token
          s = get_settings()
          print('✅ Config OK — YOLO:', s.feature_yolo_enabled, '| RAG:', s.feature_rag_enabled)
          "

      - name: Verificar schemas (Fase 2 + 4)
        run: |
          python -c "
          from app.schemas.vision import SessionCreate, FrameAnalysis, SessionComplete, SessionOut
          from app.schemas.rag    import DietRequest, RoutineRequest, IngestRequest, UserProfile
          print('✅ Schemas OK')
          "

      - name: Verificar servicio de análisis de forma (Fase 2)
        run: |
          python -c "
          from app.schemas.vision import Landmark
          from app.services.vision_service import analyze_frame
          lm = [Landmark(x=i*0.03, y=i*0.02, z=0, visibility=1) for i in range(33)]
          fb = analyze_frame('squat', lm)
          assert 0 <= fb.form_score <= 100, 'form_score fuera de rango'
          print('✅ vision_service OK — score:', fb.form_score, '| ángulos:', fb.angles)
          "

      - name: Verificar routers (sin BD)
        run: |
          python -c "
          from app.routers.health import router as health_router
          from app.routers.vision import router as vision_router
          from app.routers.rag    import router as rag_router
          print('✅ Routers importan correctamente')
          print('  /health routes:', [r.path for r in health_router.routes])
          print('  /vision routes:', [r.path for r in vision_router.routes])
          print('  /rag routes:   ', [r.path for r in rag_router.routes])
          "

  # ── APK BUILD (sin cambios) ───────────────────────────────────
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: [test-node, test-python]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Instalar dependencias frontend
        working-directory: frontend
        run: npm install

      - name: Add Android platform
        working-directory: frontend
        run: npx cap add android

      - name: Sync Capacitor
        working-directory: frontend
        run: npx cap sync android

      - name: Build APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fittracker-v2-debug
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: APK info
        run: |
          ls -lh frontend/android/app/build/outputs/apk/debug/
          echo "✅ APK build exitoso — v2 compatible"
